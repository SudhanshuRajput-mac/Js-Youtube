<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai Aur Code</title>
</head>
<body style="background-color: black; color: aliceblue;">
    <ul class="language">
        <li>Javascript</li>
    </ul>
</body>
<script>
    function addlanguage(language){
        const li = document.createElement('li')
        li.innerHTML = `${language}` ; 
        document.querySelector('.language').appendChild(li)
    }
    addlanguage("python")
    addlanguage("CPP")

    // this is optimal apporach . 
    function addoptiLang(langname){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langname))
        document.querySelector('.language').appendChild(li)
    }
    addoptiLang('golang')
    addoptiLang('sudhanshu')

    // Edit
    const sec = document.querySelector("li:nth-child(2)")
    // console.log(sec)
    // sec.innerHTML = "hero"
    // sec.innerText = "napdk"

    // replacing by creating new element . 
    const newli = document.createElement('li')
    // console.log(newli)
    newli.textContent = "HelloPython"
    sec.replaceWith(newli)
    // sec.replaceChild(newli)

    //examp 2 for edit . 
    const fourlang = document.querySelector('li:nth-child(4)')
    fourlang.outerHTML = '<li>Typescript</li>'
    // console.log(fourlang)
    // const newlifour = document.createElement('li')
    // newlifour.textContent = 'welcome'
    // fourlang.replaceWith(newlifour)

    //remove 
    const lastlang = document.querySelector('li:last-child')
    lastlang.remove()
</script>
</html>
